<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GGL QMS Control Center</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="app">

        <!-- LOGIN -->

        <section
            id="loginPage"
            class="login-page"
        >

            <div class="login-card">

                <div class="brand">

                    <div class="brand-mark">
                        GGL
                    </div>

                    <div>

                        <h1>
                            QMS CONTROL CENTER
                        </h1>

                        <p>
                            CAPA • Compliance • Complaints • Audits
                        </p>

                    </div>

                </div>


                <div class="login-heading">

                    <h2>
                        Welcome back
                    </h2>

                    <p>
                        Sign in to continue to the QMS system.
                    </p>

                </div>


                <form
                    id="loginForm"
                    autocomplete="off"
                >

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            id="username"
                            type="text"
                            placeholder="Enter username"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                id="password"
                                type="password"
                                placeholder="Enter password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <div
                        id="loginError"
                        class="login-error"
                    ></div>


                    <button
                        type="submit"
                        id="loginButton"
                        class="login-button"
                    >

                        <span id="loginButtonText">
                            Sign In
                        </span>

                        <span
                            id="loginLoader"
                            class="loader hidden"
                        ></span>

                    </button>
                    <button type="button" class="forgot-password-btn" id="forgotPasswordBtn">
  Forgot Password?
</button>

                </form>


                <div class="login-footer">

                    <span>
                        GGL QMS Control Center
                    </span>

                    <span>
                        Secure Access
                    </span>

                </div>

            </div>

        </section>


        <!-- APPLICATION -->

        <section
            id="application"
            class="application hidden"
        >

            <aside
                id="sidebar"
                class="sidebar"
            >

                <div class="sidebar-brand">

                    <div class="brand-mark">
                        GGL
                    </div>

                    <div>

                        <strong>
                            QMS
                        </strong>

                        <span>
                            CONTROL CENTER
                        </span>

                    </div>

                </div>


                <nav class="navigation">

                    <button
                        class="nav-item active"
                        data-page="dashboard"
                    >
                        <span>⌂</span>
                        Dashboard
                    </button>


                    <button
                        class="nav-item"
                        data-page="capa"
                    >
                        <span>◈</span>
                        CAPA
                    </button>


                    <button
                        class="nav-item"
                        data-page="complaints"
                    >
                        <span>◇</span>
                        Complaints
                    </button>


                    <button
                        class="nav-item"
                        data-page="compliance"
                    >
                        <span>✓</span>
                        Compliance
                    </button>


                    <button
                        class="nav-item"
                        data-page="audits"
                    >
                        <span>◎</span>
                        Audits
                    </button>


                    <button
                        class="nav-item"
                        data-page="actions"
                    >
                        <span>→</span>
                        Actions
                    </button>


                    <button
                        class="nav-item"
                        data-page="documents"
                    >
                        <span>□</span>
                        Documents
                    </button>


                    <button
                        class="nav-item"
                        data-page="evidence"
                    >
                        <span>▣</span>
                        Evidence
                    </button>


                    <button
                        class="nav-item"
                        data-page="reports"
                    >
                        <span>▤</span>
                        Reports
                    </button>


                    <div
                        id="adminNavigation"
                        class="admin-navigation hidden"
                    >

                        <div class="nav-section">
                            Administration
                        </div>

                        <button
                            class="nav-item"
                            data-page="users"
                        >
                            <span>♙</span>
                            Users
                        </button>

                        <button
                            class="nav-item"
                            data-page="auditlog"
                        >
                            <span>≡</span>
                            Audit Log
                        </button>

                    </div>

                </nav>


                <div class="sidebar-bottom">

                    <button
                        id="logoutButton"
                        class="logout-button"
                    >
                        Sign Out
                    </button>

                </div>

            </aside>


            <main class="main-content">

                <header class="topbar">

                    <button
                        id="mobileMenu"
                        class="mobile-menu"
                    >
                        ☰
                    </button>


                    <div class="topbar-title">

                        <span
                            id="pageTitle"
                        >
                            Dashboard
                        </span>

                    </div>


                    <div class="user-area">

                        <div
                            id="userName"
                            class="user-name"
                        >
                            User
                        </div>

                        <div
                            id="userRole"
                            class="user-role"
                        >
                            USER
                        </div>

                    </div>

                </header>


                <div
                    id="pageContent"
                    class="page-content"
                >

                    <!-- Dynamic pages will load here -->

                </div>

            </main>

        </section>

    </div>


    <script
        src="app.js"
    ></script>

</body>

</html>
